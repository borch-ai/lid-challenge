name: CodeQL

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '30 20 * * 1'

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  analyze-go:
    name: Analyze (Go)
    uses: borch-ai/.github/.github/workflows/codeql.yml@d681ba06277e712137904d2254f98a138e50e4fe
    with:
      language: go
      build-mode: manual
      build-command: "make build"
    secrets: inherit

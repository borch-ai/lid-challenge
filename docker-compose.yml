version: '3.8'

services:
  server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lid-server
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      APP_ENV: "${APP_ENV:-development}"
      SERVER_PORT: "8080"
      DB_DRIVER: "postgres"
      DB_DSN: "postgres://lid_user:lid_password@postgres:5432/lid_db?sslmode=disable"
      AUTH_SECRET: "${AUTH_SECRET:?AUTH_SECRET environment variable is required to secure the administrative API}"
      VENDOR_ABC_PASSWORD: "${VENDOR_ABC_PASSWORD-}"
      VENDOR_XYZ_PASSWORD: "${VENDOR_XYZ_PASSWORD-}"
      RATE_LIMIT_RPS: "50"
      RATE_LIMIT_BURST: "100"
      DEBUG: "true"
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    container_name: lid-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: lid_user
      POSTGRES_PASSWORD: lid_password
      POSTGRES_DB: lid_db
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lid_user -d lid_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  cockroach:
    image: cockroachdb/cockroach:v24.3.0
    container_name: lid-cockroach
    restart: unless-stopped
    command: start-single-node --insecure --http-port=8081
    ports:
      - "26257:26257"
      - "8081:8081"
    healthcheck:
      test: ["CMD", "cockroach", "node", "status", "--insecure"]
      interval: 5s
      timeout: 5s
      retries: 5
